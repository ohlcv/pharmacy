const nmap={};
nodes.forEach(n=>nmap[n.id]=n);

const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");

const DPR=window.devicePixelRatio||1;
const W=document.getElementById("wrap").offsetWidth;
const H=980;

canvas.width=W*DPR;
canvas.height=H*DPR;
canvas.style.height=H+"px";

ctx.scale(DPR,DPR);

const CENTER_X=W/2;
const CENTER_Y=470;

const COLORS={
found:"#0F6E56",
bridge:"#D85A30",
drug:"#185FA5",
dis:"#3B6D11",
svc:"#534AB7"
};

const GRADIENT_COLORS = {
found: { start: "#E1F5EE", end: "#CFFAF0", shadow: "rgba(15, 110, 86, 0.15)" },
bridge: { start: "#FAECE7", end: "#FAD8C8", shadow: "rgba(216, 90, 48, 0.15)" },
drug: { start: "#E6F1FB", end: "#D0E7FB", shadow: "rgba(24, 95, 165, 0.15)" },
dis: { start: "#EAF3DE", end: "#D6EBC9", shadow: "rgba(59, 109, 17, 0.15)" },
svc: { start: "#EEEDFE", end: "#DFDEFC", shadow: "rgba(83, 74, 183, 0.15)" }
};

const SYSTEMS={

neuro:[
'精神与\n中枢神经用药',
'神经系统\n常见疾病'
],

resp:[
'呼吸系统\n用药',
'呼吸系统\n常见疾病'
],

digest:[
'消化系统\n用药',
'消化系统\n常见疾病'
],

cardio:[
'心血管系统\n用药',
'血液系统\n用药',
'心血管系统\n常见疾病'
],

urowater:[
'泌尿系统\n用药',
'水电解质\n营养用药',
'泌尿系统\n常见疾病'
],

endo:[
'内分泌系统\n用药',
'内分泌系统\n常见疾病'
],

immuno:[
'解热镇痛\n抗炎抗风湿',
'抗感染\n药物',

],

onco:[
'抗肿瘤\n药物',
'肿瘤'
],

special:[
'眼科耳鼻喉\n口腔用药'
]

};

const FOUND_Y=90;
const SERVICE_Y=900;

const bridgeRadius=120;
const systemRadius=300;

const bridgeNodes=[
'受体',
'酶',
'离子通道',
'转运体',
'激素',
'病原体'
];

function placeNodes(){

const found=nodes.filter(n=>n.layer==="found");
found.forEach((n,i)=>{
    n.x=100+i*(W-200)/(found.length-1);
    n.y=FOUND_Y;
});

bridgeNodes.forEach((id,i)=>{

    const n=nmap[id];

    const a=Math.PI*2*i/bridgeNodes.length-Math.PI/2;

    n.x=CENTER_X+
        bridgeRadius*Math.cos(a);

    n.y=CENTER_Y+
        bridgeRadius*Math.sin(a);
});

const keys=Object.keys(SYSTEMS);

const angleOffset=Math.PI*2/keys.length;

keys.forEach((k,i)=>{
    const angle=angleOffset*i-Math.PI/2;
    const cx=CENTER_X+systemRadius*Math.cos(angle);
    const cy=CENTER_Y+systemRadius*Math.sin(angle);

    const arr=SYSTEMS[k];

    if(arr.length===1){
        const n=nmap[arr[0]];
        if(n){
            n.x=cx;
            n.y=cy;
        }
    }else if(arr.length===2){
        arr.forEach((id,j)=>{
            const n=nmap[id];
            if(n){
                n.x=cx+(j===0?-45:45);
                n.y=cy+(j===0?-25:25);
            }
        });
    }else{
        const spreadAngle=Math.PI*0.6;
        arr.forEach((id,j)=>{
            const n=nmap[id];
            if(n){
                const localAngle=-spreadAngle/2+spreadAngle*j/(arr.length-1);
                n.x=cx+70*Math.cos(localAngle);
                n.y=cy+50*Math.sin(localAngle);
            }
        });
    }
});

const svc=nodes.filter(n=>n.layer==="svc");

svc.forEach((n,i)=>{

    n.x=
        90+
        i*(W-180)/(svc.length-1);

    n.y=
        SERVICE_Y;

});

}

placeNodes();

const adj={};

nodes.forEach(n=>{
adj[n.id]=[];
});

edges.forEach(e=>{
adj[e[0]].push(e[1]);
adj[e[1]].push(e[0]);
});

let hover=null;

function nodeAt(x,y){

for(const n of nodes){

const dx=x-n.x;
const dy=y-n.y;

if(dx*dx+dy*dy<(n.r+3)*(n.r+3))
return n;
}

return null;

}

canvas.addEventListener("mousemove",e=>{

const r=canvas.getBoundingClientRect();

const x=(e.clientX-r.left)*(W/r.width);
const y=(e.clientY-r.top)*(H/r.height);

const n=nodeAt(x,y);

hover=n?n.id:null;

if(n){

const info=NODE_INFO[n.id];

document.getElementById("info-title")
.textContent=n.id.replace(/\n/g,'');

document.getElementById("info-code")
.textContent=info.code||"";

document.getElementById("info-body")
.textContent=info.desc||"";

}

});

function drawEdge(a,b,type){
const isHighlighted=hover && (hover===a.id || hover===b.id || adj[hover]?.includes(a.id) && adj[hover]?.includes(b.id));

ctx.beginPath();
ctx.moveTo(a.x,a.y);

const mx=(a.x+b.x)/2;
const my=(a.y+b.y)/2;
const curve=Math.abs(a.y-b.y)>100 ? 80 : 25;

ctx.quadraticCurveTo(mx,my-curve,b.x,b.y);

if(type==="net"){
ctx.setLineDash([6,4]);
const netColor=isHighlighted?"rgba(216,90,48,.7)":"rgba(216,90,48,.3)";
ctx.strokeStyle=netColor;
ctx.lineWidth=isHighlighted?1.5:0.9;
}else{
ctx.setLineDash([]);
const treeColor=isHighlighted?"rgba(100,120,140,.5)":"rgba(180,185,190,.22)";
ctx.strokeStyle=treeColor;
ctx.lineWidth=isHighlighted?1.2:0.8;
}

ctx.stroke();
ctx.setLineDash([]);

if(isHighlighted && type!=="net"){
ctx.beginPath();
ctx.moveTo(a.x,a.y);
ctx.quadraticCurveTo(mx,my-curve,b.x,b.y);
ctx.strokeStyle="rgba(24,95,165,0.1)";
ctx.lineWidth=8;
ctx.stroke();
}
}

function drawNode(n){

const active=
hover===null ||
hover===n.id ||
adj[hover]?.includes(n.id);

const isHovered=hover===n.id;
const scale=isHovered?1.08:1;
const nodeR=n.r*scale;

ctx.save();
ctx.globalAlpha=active?1:.15;

let fill="#eee";
let stroke="#999";
let gradientColors=null;

if(n.layer==="found"){
fill="#E1F5EE";
stroke=COLORS.found;
gradientColors=GRADIENT_COLORS.found;
}
else if(n.layer==="bridge"){
fill="#FAECE7";
stroke=COLORS.bridge;
gradientColors=GRADIENT_COLORS.bridge;
}
else if(n.layer==="svc"){
fill="#EEEDFE";
stroke=COLORS.svc;
gradientColors=GRADIENT_COLORS.svc;
}
else if(n.layer==="dis"){
fill="#EAF3DE";
stroke=COLORS.dis;
gradientColors=GRADIENT_COLORS.dis;
}
else{
fill="#E6F1FB";
stroke=COLORS.drug;
gradientColors=GRADIENT_COLORS.drug;
}

if(isHovered){
ctx.shadowColor=gradientColors.shadow;
ctx.shadowBlur=15;
ctx.shadowOffsetX=0;
ctx.shadowOffsetY=4;
}

const gradient=ctx.createRadialGradient(
n.x-nodeR*0.3, n.y-nodeR*0.3, 0,
n.x, n.y, nodeR
);
gradient.addColorStop(0, gradientColors.end);
gradient.addColorStop(1, gradientColors.start);

ctx.beginPath();
ctx.arc(n.x,n.y,nodeR,0,Math.PI*2);
ctx.fillStyle=gradient;
ctx.fill();

ctx.shadowColor="transparent";

ctx.strokeStyle=stroke;
ctx.lineWidth=isHovered?3:1.2;
ctx.stroke();

if(isHovered){
ctx.beginPath();
ctx.arc(n.x,n.y,nodeR+3,0,Math.PI*2);
ctx.strokeStyle=stroke+"44";
ctx.lineWidth=1;
ctx.stroke();
}

ctx.fillStyle="#1e293b";
const fontSize=n.r>25?11:n.r>20?10:9;
ctx.font=(isHovered?"600":"500")+" "+fontSize+"px Inter,sans-serif";
ctx.textAlign="center";
ctx.textBaseline="middle";

const lines=n.id.split("\n");
const lineHeight=fontSize+3;

lines.forEach((t,i)=>{
ctx.fillText(t,n.x,n.y-(lines.length-1)*lineHeight/2+i*lineHeight);
});

ctx.restore();

}

function drawSystemHalos(){
const systemColors={
neuro:"rgba(24,95,165,0.06)",
resp:"rgba(15,118,90,0.06)",
digest:"rgba(160,102,15,0.06)",
cardio:"rgba(196,48,48,0.06)",
urowater:"rgba(20,120,160,0.06)",
endo:"rgba(106,59,181,0.06)",
immuno:"rgba(176,112,32,0.06)",
onco:"rgba(102,102,102,0.06)",
special:"rgba(58,122,58,0.06)"
};

const systemNames={
neuro:"神经调控系统",resp:"呼吸系统",digest:"消化系统",
cardio:"心血管循环系统",urowater:"泌尿·水盐平衡",endo:"内分泌代谢系统",
immuno:"炎症免疫系统",onco:"肿瘤系统",special:"专科局部系统"
};

Object.entries(SYSTEMS).forEach(([k,ids])=>{
const arr=ids.map(i=>nmap[i]).filter(Boolean);
if(!arr.length) return;

const xs=arr.map(n=>n.x);
const ys=arr.map(n=>n.y);
const nodeCount=arr.length;
const padding=nodeCount===1?40:(nodeCount===2?50:60);
const minX=Math.min(...xs)-padding;
const maxX=Math.max(...xs)+padding;
const minY=Math.min(...ys)-padding;
const maxY=Math.max(...ys)+padding;

ctx.beginPath();
ctx.roundRect(minX,minY,maxX-minX,maxY-minY,16);
ctx.fillStyle=systemColors[k]||"rgba(24,95,165,0.04)";
ctx.fill();

ctx.strokeStyle="rgba(180,185,190,0.12)";
ctx.lineWidth=0.6;
ctx.stroke();

ctx.fillStyle="rgba(80,90,100,0.5)";
ctx.font="500 9px Inter,sans-serif";
ctx.textAlign="left";
ctx.textBaseline="top";
ctx.fillText(systemNames[k]||k, minX+8, minY+8);
});
}

function render(){
ctx.clearRect(0,0,W,H);

const bgGradient=ctx.createLinearGradient(0,0,0,H);
bgGradient.addColorStop(0,"#ffffff");
bgGradient.addColorStop(0.5,"#fafbfc");
bgGradient.addColorStop(1,"#f5f7fa");
ctx.fillStyle=bgGradient;
ctx.fillRect(0,0,W,H);

drawLayerBands();
drawSystemHalos();

edges.forEach(e=>{
drawEdge(nmap[e[0]],nmap[e[1]],e[2]);
});

nodes.forEach(drawNode);

requestAnimationFrame(render);
}

function drawLayerBands(){
ctx.strokeStyle="rgba(200,205,210,0.2)";
ctx.lineWidth=0.5;
ctx.setLineDash([8,4]);

ctx.beginPath();
ctx.moveTo(60,FOUND_Y);
ctx.lineTo(W-60,FOUND_Y);
ctx.stroke();

ctx.beginPath();
ctx.moveTo(60,SERVICE_Y);
ctx.lineTo(W-60,SERVICE_Y);
ctx.stroke();

ctx.setLineDash([]);
}

render();

</script>
