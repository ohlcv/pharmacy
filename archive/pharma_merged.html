const byLayer = {};
nodes.forEach(n=>{if(!byLayer[n.layer])byLayer[n.layer]=[];byLayer[n.layer].push(n);});
Object.entries(byLayer).forEach(([layer,arr])=>{
  const pad=44, avail=W-pad*2;
  arr.forEach((n,i)=>{
    n.x = pad+(arr.length===1?avail/2:avail*i/(arr.length-1));
    n.y = LY[layer];
    n.vx=0; n.vy=0; n.ax=0;
  });
});

const nmap={};
nodes.forEach(n=>nmap[n.id]=n);
const adj={};
nodes.forEach(n=>{adj[n.id]=[];});
edges.forEach(([a,b])=>{adj[a].push(b);adj[b].push(a);});

let hoverId=null;

function getPos(e){
  const rect=canvas.getBoundingClientRect();
  const scaleX=W/rect.width;
  const t=e.touches?e.touches[0]:e;
  return [(t.clientX-rect.left)*scaleX,(t.clientY-rect.top)*scaleX];
}
function nodeAt(x,y){
  for(let i=nodes.length-1;i>=0;i--){
    const n=nodes[i];
    const dx=x-n.x,dy=y-n.y;
    if(dx*dx+dy*dy<=(n.r+4)*(n.r+4)) return n;
  }
  return null;
}

function showInfo(n){
  const info=NODE_INFO[n.id];
  if(!info) return;
  const name=n.id.replace(/\n/g,'');
  document.getElementById('info-title').textContent=name;
  document.getElementById('info-title').style.color= dark?'#f0ede4':'#1a1a18';
  document.getElementById('info-code').textContent=info.code+(info.sub?' · '+info.sub:'');
  document.getElementById('info-body').textContent=info.desc||'';
  const gi=NODE_INFO[n.id];
  const gkey=gi&&gi.group&&SYS_GROUPS[gi.group];
  document.getElementById('info-group').textContent=gkey?'所属系统：'+gkey.name:'';
}
function clearInfo(){
  document.getElementById('info-title').textContent='悬停任意节点查看详情';
  document.getElementById('info-title').style.color='#999';
  document.getElementById('info-code').textContent='';
  document.getElementById('info-body').textContent='';
  document.getElementById('info-group').textContent='';
}

canvas.addEventListener('mousemove',e=>{
  const [x,y]=getPos(e);
  const n=nodeAt(x,y);
  canvas.style.cursor=n?'default':'default';
  if(n&&n.id!==hoverId){hoverId=n.id;showInfo(n);}
  else if(!n&&hoverId){hoverId=null;clearInfo();}
});
canvas.addEventListener('mouseleave',()=>{hoverId=null;clearInfo();});

// Soft physics — nodes gently stay at initial positions, no drag
function tick(){
  const repulse=1600, spring=0.03, damp=0.8;
  nodes.forEach(n=>{
    const arr=byLayer[n.layer];
    const idx=arr.indexOf(n);
    const pad=44, avail=W-pad*2;
    const tx=pad+(arr.length===1?avail/2:avail*idx/(arr.length-1));
    let fx=(tx-n.x)*spring;
    nodes.forEach(m=>{
      if(m===n||m.layer!==n.layer)return;
      const dx=n.x-m.x, d=Math.abs(dx)+0.1;
      const min=n.r+m.r+5;
      if(d<min) fx+=repulse*(dx/d)/d;
    });
    n.vx=(n.vx+fx)*damp;
    n.x+=n.vx;
    n.x=Math.max(n.r+4,Math.min(W-n.r-4,n.x));
    n.y=LY[n.layer];
  });
}

function getNodeColor(n){
  if(n.layer==='found') return C.found;
  if(n.layer==='bridge') return C.bridge;
  if(n.layer==='dis') return C.dis;
  if(n.layer==='svc') return C.svc;
  // drug layer: use system group color
  const info=NODE_INFO[n.id];
  const gkey=info&&info.group;
  const sg=gkey&&SYS_GROUPS[gkey];
  if(sg) return {fill:sg.color, stroke:sg.stroke, text: dark?'#e8e4d8':sg.stroke};
  return {fill: dark?'#1a2b40':'#E6F1FB', stroke:'#185FA5', text: dark?'#B5D4F4':'#042C53'};
}

function drawText(id, x, y, r, col, isHov){
  const lines=id.split('\n');
  const fs=r>25?10:(r>18?9:8);
  const lh=fs+2.5;
  ctx.fillStyle=col.text;
  ctx.font=`${isHov?600:500} ${fs}px var(--font-sans,sans-serif)`;
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  const totalH=lines.length*lh;
  lines.forEach((ln,i)=>{
    ctx.fillText(ln, x, y - totalH/2 + lh*i + lh/2);
  });
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=BG;
  ctx.fillRect(0,0,W,H);

  // Draw system group halos behind drug nodes
  // Group nodes by sys group, draw a rounded rect behind each cluster
  const drugNodes=nodes.filter(n=>n.layer==='drug');
  const groups={};
  drugNodes.forEach(n=>{
    const info=NODE_INFO[n.id];
    const g=info&&info.group;
    if(!g) return;
    if(!groups[g]) groups[g]=[];
    groups[g].push(n);
  });
  Object.entries(groups).forEach(([gkey,gnodes])=>{
    const sg=SYS_GROUPS[gkey];
    if(!sg||gnodes.length===0) return;
    const xs=gnodes.map(n=>n.x);
    const minX=Math.min(...xs), maxX=Math.max(...xs);
    const pad2=gnodes[0].r+10;
    const rx=minX-pad2, ry=LY.drug-gnodes[0].r-14;
    const rw=(maxX-minX)+pad2*2, rh=gnodes[0].r*2+28;
    // draw bg
    ctx.beginPath();
    const brd=10;
    ctx.moveTo(rx+brd,ry);
    ctx.lineTo(rx+rw-brd,ry);
    ctx.quadraticCurveTo(rx+rw,ry,rx+rw,ry+brd);
    ctx.lineTo(rx+rw,ry+rh-brd);
    ctx.quadraticCurveTo(rx+rw,ry+rh,rx+rw-brd,ry+rh);
    ctx.lineTo(rx+brd,ry+rh);
    ctx.quadraticCurveTo(rx,ry+rh,rx,ry+rh-brd);
    ctx.lineTo(rx,ry+brd);
    ctx.quadraticCurveTo(rx,ry,rx+brd,ry);
    ctx.closePath();
    ctx.fillStyle=sg.color+(dark?'55':'33');
    ctx.fill();
    ctx.strokeStyle=sg.stroke+'44';
    ctx.lineWidth=0.8;
    ctx.setLineDash([3,3]);
    ctx.stroke();
    ctx.setLineDash([]);
    // group label above
    ctx.fillStyle=sg.stroke+(dark?'cc':'aa');
    ctx.font=`500 9px var(--font-sans,sans-serif)`;
    ctx.textAlign='center';
    ctx.textBaseline='bottom';
    ctx.fillText(sg.name, rx+rw/2, ry-1);
  });

  // Bands
  BANDS.forEach(b=>{
    ctx.fillStyle=BAND_ALT;
    ctx.fillRect(0,b.y,W,b.h);
    ctx.fillStyle=BAND_LBL;
    ctx.font=`10px var(--font-sans,sans-serif)`;
    ctx.textAlign='right';
    ctx.textBaseline='top';
    ctx.fillText(b.label, W-8, b.y+4);
  });

  // Edges
  edges.forEach(([a,b,type])=>{
    const na=nmap[a],nb=nmap[b];
    if(!na||!nb) return;
    const isConn=hoverId&&(hoverId===a||hoverId===b);
    ctx.beginPath();
    if(na.layer===nb.layer){
      const mx=(na.x+nb.x)/2, my=(na.y+nb.y)/2-26;
      ctx.moveTo(na.x,na.y);
      ctx.quadraticCurveTo(mx,my,nb.x,nb.y);
    } else {
      ctx.moveTo(na.x,na.y);
      ctx.lineTo(nb.x,nb.y);
    }
    if(type==='net'){
      ctx.setLineDash([4,4]);
      ctx.strokeStyle=isConn?(dark?'rgba(226,75,74,0.95)':'rgba(216,90,48,0.9)') :(dark?'rgba(216,90,48,0.25)':'rgba(216,90,48,0.28)');
      ctx.lineWidth=isConn?1.8:0.8;
    } else {
      ctx.setLineDash([]);
      ctx.strokeStyle=isConn?TREE_EH:TREE_E;
      ctx.lineWidth=isConn?1.4:0.65;
    }
    ctx.stroke();
    ctx.setLineDash([]);
  });

  // Nodes
  nodes.forEach(n=>{
    const col=getNodeColor(n);
    const isHov=hoverId===n.id;
    const isNeighbor=hoverId&&adj[hoverId].includes(n.id);
    const alpha=hoverId?(isHov||isNeighbor?1:0.22):1;
    ctx.globalAlpha=alpha;

    ctx.beginPath();
    ctx.arc(n.x,n.y,n.r+(isHov?2:0),0,Math.PI*2);
    ctx.fillStyle=col.fill;
    ctx.fill();
    ctx.strokeStyle=col.stroke;
    ctx.lineWidth=isHov?2.2:0.8;
    ctx.stroke();

    drawText(n.id, n.x, n.y, n.r, col, isHov);

    // sub label below for found layer
    const info=NODE_INFO[n.id];
    if(info&&info.sub){
      ctx.font=`400 8.5px var(--font-sans,sans-serif)`;
      ctx.fillStyle=col.text;
      ctx.globalAlpha=alpha*0.65;
      ctx.textAlign='center';
      ctx.textBaseline='top';
      ctx.fillText(info.sub, n.x, n.y+n.r+4);
    }
    ctx.globalAlpha=1;
  });
}

function loop(){tick();draw();requestAnimationFrame(loop);}
loop();
</script>
