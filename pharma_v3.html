<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>药学知识拓扑图</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f6f8;
  --surface:#ffffff;
  --border:#e2e8f0;
  --text-primary:#1a202c;
  --text-secondary:#64748b;
  --text-muted:#94a3b8;
  --accent:#0F6E56;
}
body{
  font-family:'Noto Sans SC','DM Sans',sans-serif;
  background:var(--bg);
  min-height:100vh;
  overflow-x:hidden;
}
#app{
  display:flex;
  flex-direction:column;
  height:100vh;
  width:100%;
  margin:0 auto;
}

/* ── Header ── */
#header{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:12px 16px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
#header-left{
  display:flex;
  flex-direction:column;
  gap:2px;
  text-align:center;
}
#header-title{
  font-size:16px;
  font-weight:700;
  color:var(--text-primary);
  letter-spacing:-0.02em;
}
#header-sub{
  font-size:11px;
  color:var(--text-muted);
}

#controls{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}

/* ── Canvas area ── */
#canvas-wrap{
  flex:1;
  position:relative;
  overflow:hidden;
  background:var(--surface);
}
canvas{
  display:block;
  width:100%;
  height:100%;
}

/* ── Info panel (follows mouse) ── */
#info-panel{
  position:absolute;
  width:220px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px 14px;
  box-shadow:0 4px 20px rgba(0,0,0,0.12);
  pointer-events:none;
  transition:opacity 0.15s;
  opacity:0;
  z-index:100;
}
#info-panel.visible{
  opacity:1;
  transform:translateY(0);
}
#info-panel-name{
  font-size:14px;
  font-weight:700;
  color:var(--text-primary);
  margin-bottom:4px;
}
#info-panel-code{
  display:inline-block;
  font-size:10px;
  font-weight:600;
  padding:2px 8px;
  border-radius:4px;
  margin-bottom:8px;
}
#info-panel-desc{
  font-size:12px;
  line-height:1.7;
  color:var(--text-secondary);
  margin-bottom:10px;
}
#info-panel-links{
  display:flex;
  flex-direction:column;
  gap:4px;
}
.link-row{
  font-size:11px;
  color:var(--text-muted);
}
.link-row span{
  font-weight:600;
  color:var(--text-secondary);
  margin-right:4px;
}
.link-tag{
  display:inline-block;
  background:var(--bg);
  border-radius:4px;
  padding:1px 6px;
  margin:1px 2px 1px 0;
  font-size:10px;
  color:var(--text-secondary);
}
#info-panel-hint{
  margin-top:8px;
  font-size:10px;
  color:var(--text-muted);
  text-align:center;
}

/* ── Legend (horizontal in canvas) ── */
#legend-wrap{
  position:absolute;
  top:10px;
  right:10px;
  z-index:5;
}
#legend{
  background:rgba(255,255,255,0.9);
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px 12px;
  display:flex;
  flex-direction:column;
  gap:6px;
  backdrop-filter:blur(4px);
  white-space:nowrap;
  opacity:0;
  visibility:hidden;
  transform:translateX(8px);
  transition:all 0.2s ease;
}
#legend-wrap:hover #legend,
#legend-wrap.show #legend{
  opacity:1;
  visibility:visible;
  transform:translateX(0);
}
#legend-toggle{
  width:24px;
  height:24px;
  border-radius:8px;
  background:rgba(255,255,255,0.8);
  border:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:all 0.15s;
}
#legend-toggle:hover{
  background:rgba(255,255,255,1);
  border-color:var(--accent);
}
#legend-toggle svg{
  width:12px;
  height:12px;
  color:var(--text-muted);
}
.leg{
  display:flex;
  align-items:center;
  gap:7px;
  font-size:10px;
  color:var(--text-secondary);
}
.leg-dot{
  width:10px;height:10px;
  border-radius:50%;
  border:1.5px solid;
  flex-shrink:0;
}

/* ── Hint overlay ── */
#hint-bar{
  position:absolute;
  top:10px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(26,32,44,0.75);
  color:rgba(255,255,255,0.85);
  font-size:11px;
  padding:5px 14px;
  border-radius:20px;
  pointer-events:none;
  white-space:nowrap;
  backdrop-filter:blur(4px);
  transition:opacity 0.3s;
}
</style>
</head>

// Node objects with physics
const nodes=rawNodes.map(n=>({
  ...n,
  x:0,y:0,vx:0,vy:0,
  pinned:false,
  degree:0,
}));

const nmap={};
nodes.forEach(n=>nmap[n.id]=n);

// Adjacency
const adj={};
nodes.forEach(n=>adj[n.id]=new Set());
rawEdges.forEach(([a,b])=>{adj[a].add(b);adj[b].add(a);});
nodes.forEach(n=>n.degree=adj[n.id].size);

// Scale radius by degree (增强团块感)
// 多连接节点更大，增强视觉层次和团块感
nodes.forEach(n=>{
  const base=rawNodes.find(r=>r.id===n.id).r;
  n.r=base+Math.min(n.degree*1.2,12); // 增大degree影响，最大增加12
});

function initPositions(){
  const cx=W/2;
  // 初始化层核位置（均匀分布）
  LAYER_ORDER.forEach((l,i)=>{
    layerCores[l].y=(i+1)/(LAYER_ORDER.length+1)*H;
    layerCores[l].vy=0;
  });
  // 节点初始位置：X均匀随机分布，Y在层核附近较大范围内随机
  nodes.forEach(n=>{
    const coreY=layerCores[n.layer].y;
    n.x=cx+(Math.random()-0.5)*W*0.6;  // X轴大范围随机分布
    n.y=coreY+(Math.random()-0.5)*H*0.25; // Y轴在层核附近随机（允许二维分布）
    n.vx=0; n.vy=0; n.pinned=false;
  });
}

// ═══════════════════════════════════════════════════
// 宇宙四大基本力 物理引擎 · 纯四力版
// ═══════════════════════════════════════════════════
//
// 【强相互作用力】同类节点
//   · 极近距：强排斥（渐近自由）→ 防止同类重叠
//   · 中程：吸引（色禁闭）→ 同类紧密成团，不可分散
//   · 超出作用范围：骤降为零
//   → 完全替代"硬碰撞"（同类间），并保证聚集
//
// 【电磁力】异类节点
//   · 长程库仑斥力 F∝1/r²
//   · 同层异类横向推开，跨层异类纵向推开
//   → 异类不重叠；各类群自然向画布中部平衡（替代弱中心引力）
//   · 同类之间：短程排斥（同号电荷） → 防止异类重叠的补充
//
// 【引力】层间万有引力
//   · 每个节点被本层"层核"（层质心虚拟天体）吸引
//   · 层核之间互相排斥（不同层不可合并）
//   · 节点越偏离层核，受到的回拉力越强
//   · 层间距由层核排斥自动撑开，无需预设 LAYER_Y
//   → 动态确定层高度，节点被限制在本层引力井内
//
// 【弱相互作用力】量子涨落
//   · 早期随机扰动，帮助逃离局部极小
//   · 振幅指数衰减，收敛后静止
//   → 防止系统冻结在次优布局
//
// ═══════════════════════════════════════════════════

// 层定义（顺序决定初始纵向排布）
const LAYER_ORDER=['foundation','bridge','clinical','service'];

// 层核：每层一个虚拟质心天体，位置动态更新
const layerCores={};
LAYER_ORDER.forEach((l,i)=>{
  layerCores[l]={y: H*0.2 + Math.random()*H*0.6, vy:0};
});

function runForce(steps){
  const pad=50;
  const damp=0.82;
  const MAX_V=25;

  // ── 强相互作用力 ──────────────────────────────
  // 同类节点间：近排远吸，作用范围有限，有明确平衡距离
  // 物理参数已提升到模块顶部统一管理
  const G_CORE_DAMP = 0.78;    // 层核速度阻尼

  // ── 弱相互作用力 ──────────────────────────────
  // 边界恢复弹力：只防止节点跑出画布，不限制层内分布
  const W_BOUND_K   = 0.40;    // 边界恢复弹力系数
  const W_DAMP      = 0.985;   // 边界力衰减系数
  const W_TOP_PAD   = 0.05;    // 顶部边界余量
  const W_BOT_PAD   = 0.05;    // 底部边界余量

  for(let step=0;step<steps;step++){
    const alpha = Math.max(0, 1 - step/steps);

    // ════════════════════════════════════════════
    // 【引力 Part A】更新层核 Y 位置
    // 层核是独立物理实体，只受：
    // 1. 其他层核的排斥力（使用G_CORE_REP）
    // 2. 边界恢复力
    // 不追踪节点质心，避免层漂移
    // ════════════════════════════════════════════
    // 层核之间互相排斥
    for(let i=0;i<LAYER_ORDER.length;i++){
      for(let j=i+1;j<LAYER_ORDER.length;j++){
        const ca=layerCores[LAYER_ORDER[i]];
        const cb=layerCores[LAYER_ORDER[j]];
        const dy=cb.y-ca.y;
        const dist=Math.max(Math.abs(dy), 30);
        // 使用 G_CORE_REP 实现层核之间的斥力（类似电磁力）
        const repF=Math.min(G_CORE_REP/(dist*dist), 15);
        const dir=dy>=0?1:-1;
        ca.vy-=dir*repF;
        cb.vy+=dir*repF;
      }
    }
    // 层核边界恢复力（防止层核跑出画布）
    LAYER_ORDER.forEach(l=>{
      const c=layerCores[l];
      const coreMargin=H*0.12;
      // 顶部边界
      if(c.y < coreMargin){
        c.vy += (coreMargin - c.y) * 0.08;
      }
      // 底部边界
      if(c.y > H - coreMargin){
        c.vy += (H - coreMargin - c.y) * 0.08;
      }
      // 阻尼和位置更新
      c.vy *= G_CORE_DAMP;
      c.y += c.vy;
      c.y = Math.max(H*0.08, Math.min(H*0.92, c.y));
    });

    // ════════════════════════════════════════════
    // 【强相互作用力】重构：簇心吸引 + 节点间排斥
    // 实现二维稳定聚簇
    // ════════════════════════════════════════════
    // 第一步：计算每个类别的质心
    const catCenters={};
    const catNodes={};
    nodes.forEach(n=>{
      if(!catNodes[n.category]){
        catNodes[n.category]=[];
        catCenters[n.category]={x:0,y:0};
      }
      catNodes[n.category].push(n);
      catCenters[n.category].x+=n.x;
      catCenters[n.category].y+=n.y;
    });
    // 计算质心坐标
    Object.keys(catCenters).forEach(cat=>{
      const count=catNodes[cat].length;
      catCenters[cat].x/=count;
      catCenters[cat].y/=count;
    });

    // 第二步：强力 = 簇心吸引 + 节点间短程排斥
    for(let i=0;i<nodes.length;i++){
      const a=nodes[i];
      if(a.pinned)continue;
      
      // 【簇心吸引】节点→类别质心的吸引力（支持二维稳定）
      const center=catCenters[a.category];
      if(center){
        const dcx=center.x-a.x, dcy=center.y-a.y;
        const distToCenter=Math.sqrt(dcx*dcx+dcy*dcy);
        if(distToCenter>0){
          const ncx=dcx/distToCenter, ncy=dcy/distToCenter;
          // 吸引力随距离增大而增强，但有上限
          const clusterF=Math.min(distToCenter*S_ALPHA*0.5, 8);
          a.vx+=ncx*clusterF;
          a.vy+=ncy*clusterF;
        }
      }
    }

    // 第三步：节点间短程排斥（防止重叠）
    for(let i=0;i<nodes.length;i++){
      for(let j=i+1;j<nodes.length;j++){
        const a=nodes[i], b=nodes[j];
        const dx=b.x-a.x, dy=b.y-a.y;
        const dist=Math.max(Math.sqrt(dx*dx+dy*dy), 1);
        const nx=dx/dist, ny=dy/dist;
        const minDist=a.r+b.r+14;

        if(a.category===b.category){
          // 【节点间排斥】分两段：强排斥 + 弱排斥，防止重叠
          const targetDist=minDist*S_TARGET_F;
          
          if(dist < minDist){
            // 强排斥：距离过近时强力推开
            const safeDist=Math.max(dist, minDist*0.2);
            const repF=Math.min(S_REPULSE_K/(safeDist*safeDist), 300);
            if(!a.pinned){a.vx-=nx*repF; a.vy-=ny*repF;}
            if(!b.pinned){b.vx+=nx*repF; b.vy+=ny*repF;}
          } else if(dist < targetDist){
            // 弱排斥：中等距离时轻微推开，保持间距
            const repF=(targetDist-dist)*0.25;
            if(!a.pinned){a.vx-=nx*repF; a.vy-=ny*repF;}
            if(!b.pinned){b.vx+=nx*repF; b.vy+=ny*repF;}
          }
          // 同类中远程吸引已由簇心吸引处理

        } else {
          // ════════════════════════════
          // 【电磁力】类别电荷模型
          // · 同层不同类：同极相斥（q_i × q_j > 0）
          // · 异层同类：异极相吸（q_i × q_j < 0）
          // ════════════════════════════
          if(dist < EM_RANGE && dist > 1){
            const qa=Math.sqrt(catNodes[a.category]?.length || 1);
            const qb=Math.sqrt(catNodes[b.category]?.length || 1);
            const sameLayer=(a.layer===b.layer);
            const sameCat=(a.category===b.category);

            if(sameLayer && !sameCat){
              // 同层不同类：排斥 + 横向分散
              // 增加X/Y分量，保证不同类在同层分散，减少混合重叠
              const kx = Math.abs(dx) > 1 ? dx/dist : (Math.random()-0.5)*0.01;
              const ky = Math.abs(dy) > 1 ? dy/dist : (Math.random()-0.5)*0.01;
              const emF = Math.min(EM_K * qa * qb / (dist*dist), EM_MAX_F) * (alpha*0.5+0.5);
              if(!a.pinned){a.vx -= kx*emF; a.vy -= ky*emF;}
              if(!b.pinned){b.vx += kx*emF; b.vy += ky*emF;}
            } else if(!sameLayer && sameCat){
              // 异层同类：吸引（保持沿连线方向）
              const emF = Math.min(EM_K * qa * qb / (dist*dist), EM_MAX_F) * (alpha*0.5+0.5);
              if(!a.pinned){a.vx -= nx*emF; a.vy -= ny*emF;}
              if(!b.pinned){b.vx += nx*emF; b.vy += ny*emF;}
            }
          }
        }
      }
    }

    // ════════════════════════════════════════════
    // 【层势阱 Gravity】节点被本层吸引
    // 向层核方向靠拢，但不固定Y坐标
    // 层与层之间可以自由浮动
    // ════════════════════════════════════════════

    nodes.forEach(n=>{
      if(n.pinned)return;
      const coreY=layerCores[n.layer].y;
      // Y方向引力：拉向层核Y坐标
      const dyToCore=coreY-n.y;
      n.vy+=dyToCore*G_WELL_K;
    });

    // ════════════════════════════════════════════
    // 【弱相互作用力】边界恢复弹力
    // 防止节点跑出画布边界，不干扰团块形成
    // ════════════════════════════════════════════
    const weakK = W_BOUND_K * Math.pow(W_DAMP, step); // 逐渐减弱，避免振荡
    const topPad = H * W_TOP_PAD;
    const botPad = H * W_BOT_PAD;
    nodes.forEach(n=>{
      if(n.pinned)return;
      // 顶部边界恢复
      if(n.y < topPad + n.r){
        n.vy += (topPad + n.r - n.y) * weakK;
      }
      // 底部边界恢复
      if(n.y > H - botPad - n.r){
        n.vy += (H - botPad - n.r - n.y) * weakK;
      }
    });

    // ════════════════════════════════════════════
    // 速度积分 + 阻尼 + 边界
    // ════════════════════════════════════════════
    nodes.forEach(n=>{
      if(n.pinned)return;
      n.vx*=damp; n.vy*=damp;
      const spd=Math.sqrt(n.vx*n.vx+n.vy*n.vy);
      if(spd>MAX_V){n.vx=n.vx/spd*MAX_V; n.vy=n.vy/spd*MAX_V;}
      n.x+=n.vx; n.y+=n.vy;
      if(!isFinite(n.x)||!isFinite(n.y)){
        n.x=W/2+(Math.random()-0.5)*80;
        n.y=layerCores[n.layer]?.y||(H*0.5);
        n.vx=0; n.vy=0;
      }
      n.x=Math.max(pad+n.r, Math.min(W-pad-n.r, n.x));
      n.y=Math.max(pad+n.r, Math.min(H-pad-n.r, n.y));
    });
  }
  
  // 计算总运动能量
  totalEnergy=nodes.reduce((sum,n)=>sum+Math.sqrt(n.vx*n.vx+n.vy*n.vy),0);
  framesDirty=true;  // 标记帧缓存需要更新
  return totalEnergy;
}

function getHighlighted(id){
  if(!id)return null;
  const set=new Set();

function showPanel(nodeId, mouseX, mouseY){
  const panel=document.getElementById('info-panel');
  if(!nodeId){panel.classList.remove('visible');return;}

  // 计算面板位置（跟随鼠标，右下偏移，避免超出画布）
  let px = mouseX + 15;
  let py = mouseY + 15;
  const panelW = 220;
  const panelH = panel.offsetHeight || 200; // 动态读取实际高度
  if(px + panelW > W - 10) px = mouseX - panelW - 15;
  if(py + panelH > H - 10) py = mouseY - panelH - 15;
  panel.style.left = px + 'px';
  panel.style.top = py + 'px';

  panel.classList.add('visible');
  const info=NODE_INFO[nodeId]||{};
  const n=nmap[nodeId];
  const colors=CATEGORY_COLORS[n.category]||CATEGORY_COLORS.foundation;

  document.getElementById('info-panel-name').textContent=info.label||nodeId;

  const codeEl=document.getElementById('info-panel-code');
  codeEl.textContent=info.code||'';
  codeEl.style.background=colors.fill;
  codeEl.style.color=colors.text;
  codeEl.style.border='1px solid '+colors.stroke+'44';

  document.getElementById('info-panel-desc').textContent=info.desc||'';

  const linksEl=document.getElementById('info-panel-links');
  const nbIds=[...adj[nodeId]];
  if(nbIds.length){
    const nLayerIdx=LAYER_ORDER.indexOf(n.layer);
    const upstream=nbIds.filter(id=>{
      const nb=nmap[id];
      return nb&&LAYER_ORDER.indexOf(nb.layer)<nLayerIdx;
    });
    const downstream=nbIds.filter(id=>{
      const nb=nmap[id];
      return nb&&LAYER_ORDER.indexOf(nb.layer)>nLayerIdx;
    });
    let html='';
    if(upstream.length){
      html+=`<div class="link-row"><span>上游</span>${upstream.map(id=>`<span class="link-tag">${NODE_INFO[id]?.label||id}</span>`).join('')}</div>`;
    }
    if(downstream.length){
      html+=`<div class="link-row"><span>下游</span>${downstream.map(id=>`<span class="link-tag">${NODE_INFO[id]?.label||id}</span>`).join('')}</div>`;
    }
    linksEl.innerHTML=html;
  } else {
    linksEl.innerHTML='';
  }
  panel.classList.add('visible');
}

function computeGroupFrames(){
  const frames={};
  Object.entries(CATEGORY_GROUPS).forEach(([sys,ids])=>{
    const ns=ids.map(id=>nmap[id]).filter(Boolean);
    if(!ns.length)return;
    const pad=28+Math.max(...ns.map(n=>n.r));
    const xs=ns.map(n=>n.x), ys=ns.map(n=>n.y);
    frames[sys]={
      minX:Math.min(...xs)-pad,
      maxX:Math.max(...xs)+pad,
      minY:Math.min(...ys)-pad-12,
      maxY:Math.max(...ys)+pad,
    };
  });
  return frames;
}

// CACHE & OPTIMIZATION
// ═══════════════════════════════════════════════════
// 缓存：只在下一次物理迭代前失效
let cachedFrames=null;
let framesDirty=true;

function getGroupFrames(){
  if(framesDirty){
    cachedFrames=computeGroupFrames();
    framesDirty=false;
  }
  return cachedFrames;
}

// 运动能量检测：低于阈值时暂停渲染循环
let totalEnergy=Infinity;
let lastRenderTime=0;
let isSleeping=false;
const ENERGY_THRESHOLD=0.5;  // 总能量阈值
const MIN_DELTA_TIME=16;      // 最小帧间隔(ms)

function drawGroupBg(frames){
  Object.entries(frames).forEach(([sys,f])=>{
    const bg=CATEGORY_BG[sys]||'rgba(200,200,200,0.05)';
    const stroke=CATEGORY_COLORS[sys]?.stroke||'#ccc';
    ctx.save();
    ctx.beginPath();
    ctx.roundRect(f.minX,f.minY,f.maxX-f.minX,f.maxY-f.minY,16);
    ctx.fillStyle=bg;
    ctx.fill();
    ctx.strokeStyle=stroke+'28';
    ctx.lineWidth=1;
    ctx.stroke();
    ctx.restore();

    // Label: top-outside the frame
    ctx.save();
    ctx.font='600 9px Noto Sans SC,sans-serif';
    ctx.textAlign='left';
    ctx.textBaseline='bottom';
    ctx.fillStyle=CATEGORY_COLORS[sys]?.stroke||'#888';
    ctx.globalAlpha=0.7;
    ctx.fillText(CATEGORY_LABELS[sys]||sys, f.minX+6, f.minY-2);
    ctx.restore();
  });
}

function drawEdge(a,b,type,highlighted){
  ctx.save();
  const isLit=highlighted?highlighted.has(a.id)&&highlighted.has(b.id):true;

  ctx.globalAlpha=isLit?1:0.04;

  ctx.beginPath();
  ctx.moveTo(a.x,a.y);
  const mx=(a.x+b.x)/2;
  const my=(a.y+b.y)/2;
  const dy=Math.abs(b.y-a.y);
  const curve=dy>100?40:16;
  ctx.quadraticCurveTo(mx,my-curve,b.x,b.y);

  if(type==='net'){
    ctx.setLineDash([5,4]);
    ctx.strokeStyle=isLit?'rgba(216,90,48,0.5)':'rgba(216,90,48,0.3)';
    ctx.lineWidth=1;
  } else {
    ctx.setLineDash([]);
    ctx.strokeStyle=isLit?'rgba(80,110,160,0.3)':'rgba(180,185,190,0.15)';
    ctx.lineWidth=isLit?1.2:0.7;
  }
  ctx.stroke();

  // Highlight glow
  if(isLit&&highlighted){
    ctx.beginPath();
    ctx.moveTo(a.x,a.y);
    ctx.quadraticCurveTo(mx,my-curve,b.x,b.y);
    ctx.strokeStyle='rgba(24,95,165,0.07)';
    ctx.lineWidth=10;
    ctx.setLineDash([]);
    ctx.stroke();
  }
  ctx.restore();
}

function drawNode(n,highlighted){
  const isHovered=hovered===n.id;
  const isLocked=locked===n.id;
  const isActive=!highlighted||highlighted.has(n.id);
  const isSysFilter=!activeSystem||(CATEGORY_GROUPS[activeSystem]||[]).includes(n.id)
    ||(n.category==='bridge');

  ctx.save();
  let alpha=1;
  if(!isActive)alpha=0.07;
  else if(!isSysFilter)alpha=0.15;
  ctx.globalAlpha=alpha;

  const scale=isHovered||isLocked?1.12:1;
  const nodeR=n.r*scale;
  const colors=CATEGORY_COLORS[n.category]||CATEGORY_COLORS.foundation;

  if(isHovered||isLocked){
    ctx.shadowColor=colors.stroke+'55';
    ctx.shadowBlur=18;
    ctx.shadowOffsetY=3;
  }

  // Fill
  ctx.beginPath();
  ctx.arc(n.x,n.y,nodeR,0,Math.PI*2);
  const grad=ctx.createRadialGradient(n.x-nodeR*0.3,n.y-nodeR*0.3,0,n.x,n.y,nodeR);
  grad.addColorStop(0,lighten(colors.fill,0.3));
  grad.addColorStop(1,colors.fill);
  ctx.fillStyle=grad;
  ctx.fill();

  ctx.shadowColor='transparent';

  // Stroke
  ctx.strokeStyle=colors.stroke;
  ctx.lineWidth=isHovered||isLocked?2.5:1.3;
  ctx.stroke();

  // Locked indicator ring
  if(isLocked){
    ctx.beginPath();
    ctx.arc(n.x,n.y,nodeR+5,0,Math.PI*2);
    ctx.strokeStyle=colors.stroke+'55';
    ctx.lineWidth=1.5;
    ctx.setLineDash([4,3]);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // Text
  ctx.globalAlpha=alpha;
  ctx.fillStyle=colors.text;
  const fontSize=n.r>28?12:n.r>22?11:10;
  ctx.font=(isHovered||isLocked?'700':'500')+' '+fontSize+'px Noto Sans SC,sans-serif';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  const label=NODE_INFO[n.id]?.label||n.id;
  // 按词语换行（每2-4个字一行，根据节点大小调整）
  const maxChars=n.r>28?4:n.r>22?3:2;
  const words=label.match(new RegExp('.{1,'+maxChars+'}','g'))||[label];
  const lh=fontSize+2;
  words.forEach((line,i)=>{
    ctx.fillText(line,n.x,n.y-(words.length-1)*lh/2+i*lh);
  });

  ctx.restore();
}

function lighten(hex,amt){
  // 将hex颜色变亮amt（0-1），返回新的hex
  // 支持 #RRGGBB 格式
  const r=parseInt(hex.slice(1,3),16);
  const g=parseInt(hex.slice(3,5),16);
  const b=parseInt(hex.slice(5,7),16);
  const nr=Math.min(255, Math.round(r + (255-r)*amt));
  const ng=Math.min(255, Math.round(g + (255-g)*amt));
  const nb=Math.min(255, Math.round(b + (255-b)*amt));
  return '#' + nr.toString(16).padStart(2,'0')
             + ng.toString(16).padStart(2,'0')
             + nb.toString(16).padStart(2,'0');
}

function render(){
  ctx.clearRect(0,0,W,H);

  // Background
  ctx.fillStyle='#fafbfc';
  ctx.fillRect(0,0,W,H);

  ctx.save();
  ctx.translate(pan.x,pan.y);
  ctx.scale(zoom,zoom);

  const frames=getGroupFrames();  // 使用缓存的frames

  // Active system highlight overlay
  if(activeSystem){
    ctx.save();
    ctx.fillStyle='rgba(240,245,255,0.5)';
    ctx.fillRect(-pan.x/zoom,-pan.y/zoom,W/zoom,H/zoom);
    ctx.restore();
  }

  drawGroupBg(frames);

  const focusId=locked||hovered;
  const highlighted=focusId?getHighlighted(focusId):null;

  // System filter: build set
  let sysSet=null;
  if(activeSystem){
    sysSet=new Set(CATEGORY_GROUPS[activeSystem]||[]);
    // always show core/bridge
    nodes.forEach(n=>{if(n.category==='bridge')sysSet.add(n.id);});
  }

  // Edges
  rawEdges.forEach(([a,b,type])=>{
    const na=nmap[a],nb=nmap[b];
    if(na&&nb) drawEdge(na,nb,type,highlighted);
  });

  // Nodes
  nodes.forEach(n=>drawNode(n,highlighted));

  ctx.restore();

  // 运动能量检测：节点稳定时暂停渲染
  const now=performance.now();
  if(isSleeping){
    // 睡眠中，等待交互唤醒
  } else if(totalEnergy < ENERGY_THRESHOLD && now - lastRenderTime > 100){
    // 能量低且超过100ms，暂停渲染
    isSleeping=true;
  } else {
    lastRenderTime=now;
    requestAnimationFrame(render);
  }
}

// 交互时唤醒渲染循环
function wakeUpRender(){
  if(isSleeping){
    isSleeping=false;
    lastRenderTime=performance.now();
    requestAnimationFrame(render);
  }
}

// ═══════════════════════════════════════════════════
// MOUSE / TOUCH EVENTS
// ═══════════════════════════════════════════════════
function getNodeAt(cx,cy){
  const {x,y}=toWorld(cx,cy);
  for(const n of nodes){
    const dx=x-n.x,dy=y-n.y;
    if(dx*dx+dy*dy<(n.r+6)*(n.r+6))return n;
  }
  return null;
}

function getGroupAt(cx,cy){
  const {x,y}=toWorld(cx,cy);
  const frames=getGroupFrames();  // 使用缓存
  for(const [sys,f] of Object.entries(frames)){
    if(x>=f.minX && x<=f.maxX && y>=f.minY && y<=f.maxY){
      return {sys, frame:f};
    }
  }
  return null;
}

canvas.addEventListener('mousemove',e=>{
  const rect=canvas.getBoundingClientRect();
  const cx=e.clientX-rect.left;
  const cy=e.clientY-rect.top;

  if(drag){
    const {x,y}=toWorld(cx,cy);
    if(drag.type==='node'){
      drag.node.x=x;
      drag.node.y=y;
      drag.node.vx=0;drag.node.vy=0;
      // 锁定状态下跟随节点移动
      if(locked===drag.node.id){
        const screenX=drag.node.x*zoom+pan.x;
        const screenY=drag.node.y*zoom+pan.y;
        showPanel(locked,screenX,screenY);
      }
    } else if(drag.type==='group'){
      // 先获取旧的框位置（在移动任何节点之前）
      const oldFrame=computeGroupFrames()[drag.sys];
      if(!oldFrame)return;
      
      // 计算新的框左上角位置
      const newMinX=x-drag.offsetX;
      const newMinY=y-drag.offsetY;
      
      // 计算偏移量
      const dx=newMinX-oldFrame.minX;
      const dy=newMinY-oldFrame.minY;
      
      // 移动该类所有节点
      (CATEGORY_GROUPS[drag.sys]||[]).forEach(id=>{
        const node=nmap[id];
        if(node){
          node.x+=dx;
          node.y+=dy;
          node.vx=0;node.vy=0;
        }
      });
    }
    return;
  }

  const n=getNodeAt(cx,cy);
  if(n){
    hovered=n.id;
    canvas.style.cursor='pointer';
    if(!locked)showPanel(n.id, cx, cy);
    return;
  }
  // 未命中节点才检查group
  const group=getGroupAt(cx,cy);
  hovered=null;
  canvas.style.cursor=group?'pointer':'default';

  if(!locked){
    showPanel(null, cx, cy);
  }
});

canvas.addEventListener('click',e=>{
  const rect=canvas.getBoundingClientRect();
  const cx=e.clientX-rect.left;
  const cy=e.clientY-rect.top;
  const n=getNodeAt(cx,cy);
  if(n){
    if(locked===n.id){locked=null;showPanel(null);}
    else{locked=n.id;showPanel(n.id,cx,cy);}
  } else {
    locked=null;showPanel(null);
  }
});

canvas.addEventListener('mousedown',e=>{
  if(e.button!==0)return;
  wakeUpRender();  // 交互时唤醒渲染循环
  const rect=canvas.getBoundingClientRect();
  const cx=e.clientX-rect.left;
  const cy=e.clientY-rect.top;
  
  // 优先检查节点
  const n=getNodeAt(cx,cy);
  if(n){
    drag={node:n, type:'node'};
    n.pinned=true;
    return;
  }
  
  // 检查类背景框
  const group=getGroupAt(cx,cy);
  if(group){
    const {x,y}=toWorld(cx,cy);
    drag={
      type:'group',
      sys:group.sys,
      offsetX:x-group.frame.minX,
      offsetY:y-group.frame.minY
    };
    // 锁定该类所有节点
    (CATEGORY_GROUPS[group.sys]||[]).forEach(id=>{
      const node=nmap[id];
      if(node)node.pinned=true;
    });
  }
});

canvas.addEventListener('mouseup',()=>{
  if(drag){
    if(drag.type==='node'){
      drag.node.pinned=false;
    } else if(drag.type==='group'){
      (CATEGORY_GROUPS[drag.sys]||[]).forEach(id=>{
        const node=nmap[id];
        if(node)node.pinned=false;
      });
    }
    drag=null;
  }
});

canvas.addEventListener('mouseleave',()=>{
  if(drag){
    if(drag.type==='node'){
      drag.node.pinned=false;
    } else if(drag.type==='group'){
      (CATEGORY_GROUPS[drag.sys]||[]).forEach(id=>{
        const node=nmap[id];
        if(node)node.pinned=false;
      });
    }
    drag=null;
  }
  hovered=null;
});

canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  wakeUpRender();  // 交互时唤醒渲染循环
  const rect=canvas.getBoundingClientRect();
  const mx=e.clientX-rect.left;
  const my=e.clientY-rect.top;
  const delta=e.deltaY>0?0.9:1.1;
  const newZoom=Math.max(0.4,Math.min(3,zoom*delta));
  pan.x=mx-(mx-pan.x)*(newZoom/zoom);
  pan.y=my-(my-pan.y)*(newZoom/zoom);
  zoom=newZoom;
},{passive:false});

// ═══════════════════════════════════════════════════
// CONTROLS
// ═══════════════════════════════════════════════════

// 图例点击toggle（支持移动端）
const legendWrap=document.getElementById('legend-wrap');
legendWrap.addEventListener('click',()=>{
  legendWrap.classList.toggle('show');
});

// 删除系统筛选功能（无UI入口）
let activeSystem=null;

// Hide hint bar after 5s
setTimeout(()=>{
  const h=document.getElementById('hint-bar');
  h.style.opacity='0';
  setTimeout(()=>h.style.display='none',400);
},5000);

// ═══════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════
resize();
render();

window.addEventListener('resize',()=>{
  resize();
});
</script>
